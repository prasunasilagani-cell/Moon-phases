<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 2px solid white;
        }.second{
            height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 2px 2px 2px 2px white;
        }
        .third{
           height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 5px 5px 5px 5px white;  
        }.fourth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 10px 10px 5px 5px white;
        }.fifth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 15px 15px 5px 5px white;
        }.sixth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 20px 20px 5px 5px white;
        }.seventh{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 25px 25px 5px 5px white;
        }.eighth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 30px 30px 5px 5px white;
        }.ninth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 35px 35px 5px 5px white;
        }.tenth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 40px 40px 5px 5px white;
        }.eleventh{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 50px 50px 5px 5px white;
        }.tewelth{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 60px 60px 5px 5px white;
        }.thirteen{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 70px 70px 5px 5px white;
        }.fourteen{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 80px 80px 5px 5px white;
        }.fifteen{
             height: 100px;
            width:100px;
            border-radius: 50%;
            box-shadow: 100px 100px 5px 5px white;
           
        }
        #box{
            height: 200px;
            width: 200px;
            background-color: black;
            margin: 15px;
           
        }
        .container{
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        body{
            background-color:#F4F2F2;
        }
    </style>
</head>
<body>
    <h1 align="center">Moon Phases</h1>
    <div class="container">
    <div id="box">
    <div class="first"></div></div>
   <div id="box"><div class="second"></div></div>
    <div id="box"><div class="third"></div></div>
    <div id="box"><div class="fourth"></div></div>
   <div id="box"> <div class="fifth"></div></div></div>
    <div class="container"><div id="box"><div class="sixth"></div></div>
    <div id="box"><div class="seventh"></div></div>
    <div id="box"><div class="eighth"></div></div>
    <div id="box"><div class="ninth"></div></div>
    <div id="box"><div class="tenth"></div></div></div>
    <div class="container"><div id="box"><div class="eleventh"></div></div>
    <div id="box"><div class="tewelth"></div></div>
    <div id="box"><div class="thirteen"></div></div>
    <div id="box"><div class="fourteen"></div></div>
    <div id="box"><div class="fifteen"></div></div>
    </div>
</body>
</html>
